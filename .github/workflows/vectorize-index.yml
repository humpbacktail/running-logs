name: Vectorize Index

on:
  push:
    branches: [main]
    paths:
      - 'logs/**.md'

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed log files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- 'logs/*.md' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Index to Vectorize
        if: steps.changed.outputs.files != ''
        run: |
          for FILE in ${{ steps.changed.outputs.files }}; do
            FILENAME=$(basename "$FILE")
            CONTENT=$(cat "$FILE")
            echo "Indexing $FILENAME..."
            curl -s -X POST "${{ secrets.WORKER_URL }}/index" \
              -H "Authorization: Bearer ${{ secrets.INDEX_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg filename "$FILENAME" --arg content "$CONTENT" '{filename: $filename, content: $content}')"
          done
